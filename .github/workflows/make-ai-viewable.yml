name: Make AI-viewable copy

on:
  push:
    paths:
      - '屏幕截图 2026-09-30 103956.png'
      - '.github/workflows/make-ai-viewable.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Convert image
        run: |
          mkdir -p ai-view
          convert "屏幕截图 2026-09-30 103956.png"             -resize "640x640>"             -strip             -quality 50             ai-view/screenshot.jpg

      - name: Commit converted copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-view/screenshot.jpg
          git diff --cached --quiet || git commit -m "Add smaller AI-viewable image copy"
          git push
