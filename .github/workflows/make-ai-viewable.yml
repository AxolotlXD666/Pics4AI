name: Make AI-viewable copy

on:
  push:
    paths:
      - '屏幕截图 2026-09-30 103956.png'
      - '屏幕截图 2026-09-30 124417.png'
      - '屏幕截图 2026-09-30 131516.png'
      - '屏幕截图 2026-09-30 134523.png'
      - '屏幕截图 2026-09-30 141007.png'
      - '*.png'
      - '.github/workflows/make-ai-viewable.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Convert images
        run: |
          mkdir -p ai-view
          convert "屏幕截图 2026-09-30 103956.png" -resize "640x640>" -strip -quality 50 ai-view/screenshot.jpg
          convert "屏幕截图 2026-09-30 103956.png" -crop 1200x900+0+300 +repage -resize "1400x1400>" -strip -quality 75 ai-view/highway.jpg
          convert "屏幕截图 2026-09-30 103956.png" -resize "1400x1400>" -strip -quality 75 ai-view/full.jpg
          convert "屏幕截图 2026-09-30 124417.png" -resize "1600x1600>" -strip -quality 85 ai-view/new.jpg
          convert "屏幕截图 2026-09-30 131516.png" -resize "1600x1600>" -strip -quality 85 ai-view/new2.jpg
          convert "屏幕截图 2026-09-30 134523.png" -resize "1600x1600>" -strip -quality 85 ai-view/new3.jpg
          convert "屏幕截图 2026-09-30 141007.png" -resize "1600x1600>" -strip -quality 85 ai-view/new4.jpg

          # Automatically create an AI-viewable copy for every PNG in the repo root.
          for f in *.png; do
            [ -e "$f" ] || continue
            base="${f%.png}"
            convert "$f" -resize "1600x1600>" -strip -quality 85 "ai-view/${base}.jpg"
          done

      - name: Commit converted copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-view/
          git diff --cached --quiet || git commit -m "Add full view for scale measurement"
          git push
