<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国 Google Earth 相对偏移实测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#20252b;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1500px;margin:22px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce1e6;border-radius:18px;overflow:hidden;box-shadow:0 12px 38px #00000012}
header{padding:24px 28px 18px;border-bottom:1px solid #e4e7ea;display:flex;justify-content:space-between;align-items:end}
h1{margin:0 0 7px;font-size:25px}.sub{font-size:13px;color:#6c747d}.count{font-size:12px;color:#6c747d;border:1px solid #dce1e6;padding:7px 10px;border-radius:99px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px}.map{position:relative;background:#f9fafb}svg{width:100%;height:780px;display:block}
.province{fill:#edf0f2;stroke:#aab2bb;stroke-width:1.05}.arrow{stroke:#c52f2f;fill:#c52f2f;stroke-linecap:round;filter:drop-shadow(0 1px 1px #fff)}.dot{fill:#fff;stroke:#1e2429;stroke-width:2.6}.label{font-size:17px;font-weight:700;fill:#20252b;paint-order:stroke;stroke:white;stroke-width:4px;pointer-events:none}
.side{border-left:1px solid #e3e6e9;padding:20px}.side h2{font-size:16px;margin:0 0 5px}.hint{font-size:12px;color:#747d86;line-height:1.6;margin-bottom:16px}
.item{border:1px solid #e0e4e8;border-radius:11px;padding:12px;margin-bottom:9px;cursor:pointer}.item:hover{border-color:#c5cbd1;box-shadow:0 4px 14px #0000000c}.top{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.dist{color:#c33f3f}.site{font-size:11px;color:#747d86;margin-top:4px}.meta{font-size:11px;color:#4f5861;margin-top:7px}
.legend{position:absolute;left:18px;bottom:18px;background:#fffffff2;border:1px solid #dce1e6;border-radius:11px;padding:11px 13px;font-size:11px;line-height:1.8;box-shadow:0 4px 15px #00000010}.red{display:inline-block;width:30px;height:3px;background:#d34a4a;vertical-align:middle;margin-right:7px}
.note{font-size:11px;color:#747d86;line-height:1.65;border-top:1px solid #e4e7ea;padding-top:14px;margin-top:18px}
.tip{position:fixed;display:none;z-index:9;background:#20252b;color:white;border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.6;pointer-events:none;box-shadow:0 7px 24px #0005}
@media(max-width:900px){.main{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #e3e6e9}.map svg{height:560px}header{align-items:flex-start;gap:15px;flex-direction:column}}
</style></head><body>
<div class="wrap"><div class="card">
<header><div><h1>中国各城市 Google Earth 相对偏移实测</h1><div class="sub">方向与距离来自已完成的地物对照测量；箭头统一放大显示，保持距离比例。</div></div><div class="count">当前纳入：3 个已确认样本</div></header>
<div class="main"><div class="map"><svg id="map" viewBox="0 0 1120 780"></svg>
<div class="legend"><div><span class="red"></span>相对偏移方向</div><div>○ 城市实测位置</div><div>箭头长度为视觉放大，不代表全国地图比例</div></div></div>
<aside class="side"><h2>测量记录</h2><div class="hint">悬停地图上的箭头或城市点，可查看具体记录。</div><div id="list"></div><div class="note">底图：cn-atlas 公开中国省级行政区 GeoJSON。该数据集提供省级、全国边界 GeoJSON，坐标未投影。<br><br>未把鼠标指针坐标当作地理基准；已撤回的西安旧估计值也没有纳入。</div></aside></div>
</div></div><div id="tip" class="tip"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const S=[{"city":"成都","site":"已确认地标样本","lat":30.5728,"lon":104.0665,"distance":320,"bearing":225,"direction":"西南","uncertainty":"±20 m"},{"city":"武汉","site":"辛亥革命博物馆","lat":30.5928,"lon":114.3055,"distance":700,"bearing":45,"direction":"东北","uncertainty":"±30 m"},{"city":"西安","site":"小雁塔","lat":34.2408,"lon":108.9374,"distance":680,"bearing":112,"direction":"东南偏东","uncertainty":"±30–40 m"}];
const svg=d3.select("#map"),tip=document.getElementById("tip"),W=1120,H=780;
const P=d3.geoMercator().center([105,35.5]).scale(1080).translate([W/2,H/2+28]),path=d3.geoPath(P);
function end(s){const p=P([s.lon,s.lat]),a=s.bearing*Math.PI/180,L=s.distance/1000*45;return[p[0]+L*Math.sin(a),p[1]-L*Math.cos(a)]}
function show(e,s){tip.style.display="block";tip.style.left=e.clientX+14+"px";tip.style.top=e.clientY+14+"px";tip.innerHTML="<b>"+s.city+" · "+s.site+"</b><br>偏移约 "+s.distance+" m（"+s.uncertainty+"）<br>方向："+s.direction}
function hide(){tip.style.display="none"}
async function main(){
 const gjson=await fetch("https://cdn.jsdelivr.net/npm/cn-atlas@0.1.2/provinces.json").then(r=>r.json());
 svg.append("g").selectAll("path").data(gjson.features||gjson).join("path").attr("class","province").attr("d",path);
 const g=svg.append("g");
 S.forEach((s,i)=>{const p=P([s.lon,s.lat]),[x,y]=p,[ex,ey]=end(s),dx=ex-x,dy=ey-y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
  const l=g.append("line").attr("class","arrow").attr("stroke-width",6).attr("x1",x).attr("y1",y).attr("x2",ex).attr("y2",ey);
  const h=g.append("polygon").attr("class","arrow").attr("points",ex+","+ey+" "+(ex-ux*20+px*9)+","+(ey-uy*20+py*9)+" "+(ex-ux*20-px*9)+","+(ey-uy*20-py*9));
  const d=g.append("circle").attr("class","dot").attr("cx",x).attr("cy",y).attr("r",8);
  [l,h,d].forEach(o=>o.on("mousemove",e=>show(e,s)).on("mouseleave",hide));
  g.append("text").attr("class","label").attr("x",x+9).attr("y",y+(i%2?27:-13)).text(s.city);
 });
 const list=document.getElementById("list");S.forEach(s=>{const el=document.createElement("div");el.className="item";el.innerHTML='<div class="top"><span>'+s.city+'</span><span class="dist">'+s.distance+' m</span></div><div class="site">'+s.site+'</div><div class="meta">'+s.direction+' · '+s.uncertainty+'</div>';el.onmousemove=e=>show(e,s);el.onmouseleave=hide;list.appendChild(el)})
}
main();
</script></body></html>
